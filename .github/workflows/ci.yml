name: benchmark-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile acl_heavy_data_benchmark.py test_acl_heavy_data_benchmark.py
      - run: python -m unittest -v
      - run: python acl_heavy_data_benchmark.py selftest
